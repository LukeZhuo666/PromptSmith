<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f8f6"><title>提示匠 · Prompt 工作台</title><style>
:root{--bg:#f8f8f6;--ink:#20232a;--muted:#707783;--line:#e1e4e8;--blue:#3759e8;--purple:#7a65db;--soft:#eef1ff;--green:#278663}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#f0f1ee;border-right:1px solid var(--line);padding:22px 15px}.logo{font-size:20px;font-weight:850;letter-spacing:-.06em;padding:7px 11px 25px}.logo i{font-style:normal;color:var(--blue)}.new{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px;text-align:left}.side h3{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:25px 10px 9px}.navitem{padding:9px 10px;border-radius:7px;color:#454c57;font-size:13px;cursor:pointer;display:flex;justify-content:space-between}.navitem:hover,.navitem.active{background:#e1e4e8;color:var(--blue)}.history{font-size:12px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sidefoot{position:absolute;bottom:20px;font-size:11px;color:var(--muted)}.main{min-width:0}.top{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{color:var(--muted);font-size:12px}.avatar{background:#e9e8fd;color:var(--purple);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:700}.content{max-width:1080px;margin:0 auto;padding:35px 35px 60px}.heading .eyebrow{font-size:10px;letter-spacing:.17em;color:var(--blue);font-weight:800}.heading h1{font-size:35px;letter-spacing:-.05em;margin:7px 0}.heading p{color:var(--muted);margin:0}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:25px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 3px 10px #25334c06}.card h2{font-size:15px;margin:0 0 15px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:700;color:#59616e;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:10px 11px;background:white;outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #3759e818}.field textarea{min-height:98px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:white;padding:7px 10px;border-radius:7px;font-size:11px;color:#566071}.chip.active{border-color:var(--blue);background:var(--soft);color:var(--blue)}.output{min-height:330px;white-space:pre-wrap;line-height:1.72;background:#f7f8fc;border:1px solid #e2e6f2;border-radius:8px;padding:15px;color:#293241;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:white;border-radius:7px;padding:9px 13px;color:var(--ink);cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:hover{transform:translateY(-1px)}.quality{display:flex;align-items:center;gap:13px;margin-top:14px;padding:12px;background:#f4f5f8;border-radius:8px}.score{width:42px;height:42px;border:3px solid var(--green);color:var(--green);border-radius:50%;display:grid;place-items:center;font-weight:800}.quality small{display:block;color:var(--muted);font-size:11px}.tip{margin-top:12px;color:var(--muted);font-size:11px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20232a;color:white;padding:10px 17px;border-radius:99px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:25px 18px}.top{padding:0 18px}}@media(max-width:620px){.workspace{grid-template-columns:1fr}.heading h1{font-size:29px}.twocol{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="logo">提示匠<i>.</i></div><button class="new" id="new">＋ 新建 Prompt</button><h3>工作台</h3><div class="navitem active">Prompt 构建器</div><div class="navitem" id="savednav">我的收藏 <span id="savedcount">0</span></div><h3>最近使用</h3><div id="history"></div><div class="sidefoot">PROMPTSMITH · LOCAL WORKSPACE</div></aside><main class="main"><header class="top"><div class="crumb">工作台　/　Prompt 构建器</div><div class="avatar">匠</div></header><div class="content"><section class="heading"><div class="eyebrow">PROMPT DESIGN WORKSPACE</div><h1>把想法，整理成好用的指令。</h1><p>描述你要完成的任务，提示匠会生成结构清晰、可继续编辑的 Prompt。</p></section><div class="workspace"><section class="card"><h2>定义你的任务</h2><div class="field"><label>任务类型</label><div class="chips" id="types"><button class="chip active" data-type="写作">写作</button><button class="chip" data-type="学习">学习</button><button class="chip" data-type="编程">编程</button><button class="chip" data-type="创意策划">创意策划</button><button class="chip" data-type="研究分析">研究分析</button></div></div><div class="field"><label>你希望 AI 扮演什么角色？</label><input id="role" value="资深内容策划"></div><div class="field"><label>你要完成什么？</label><textarea id="goal" placeholder="说清楚背景、对象和想要的结果…">为一款面向年轻人的城市骑行活动写一条社交媒体招募文案。</textarea></div><div class="twocol"><div class="field"><label>语气</label><select id="tone"><option>清晰、自然</option><option>专业、严谨</option><option>轻松、有活力</option><option>温暖、真诚</option><option>简洁、有说服力</option></select></div><div class="field"><label>输出形式</label><select id="format"><option>分段文案</option><option>要点列表</option><option>表格</option><option>步骤说明</option><option>JSON</option></select></div></div><div class="field"><label>额外约束（选填）</label><input id="rules" placeholder="字数、禁用词、受众等"></div><button class="btn primary" id="build">生成 Prompt ↗</button></section><section class="card"><h2>生成结果 <span style="color:var(--muted);font-size:11px;font-weight:400">· 可直接复制使用</span></h2><div class="output" id="output"></div><div class="quality"><div class="score" id="score">86</div><div><b id="qualitytitle">结构完整度</b><small id="qualitytext">已包含角色、目标、语气与输出要求。补充背景细节可以进一步提高结果质量。</small></div></div><div class="actions"><button class="btn primary" id="copy">复制 Prompt</button><button class="btn" id="save">☆ 收藏</button><button class="btn" id="download">导出 .txt</button></div><p class="tip">提示匠在本地组合提示词，不会自动调用 AI 服务，也不需要 API Key。复制后可粘贴到你常用的 AI 工具中。</p></section></div></div></main></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s);let type='写作',saved=JSON.parse(localStorage.promptSmithSaved||'[]'),history=JSON.parse(localStorage.promptSmithHistory||'[]');function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1800)}function build(){let role=$('#role').value.trim()||'专业助手',goal=$('#goal').value.trim()||'请协助我完成指定任务',tone=$('#tone').value,format=$('#format').value,rules=$('#rules').value.trim();let p=`# 角色\n你是一位${role}。\n\n# 任务\n${goal}\n\n# 工作要求\n- 先理解任务背景与目标受众；如有关键事实缺失，先提出必要问题。\n- 以${tone}的方式完成任务。\n- 结果采用${format}呈现。\n- 内容具体、准确、便于直接使用，避免空泛套话。${rules?`\n- 额外约束：${rules}`:''}\n\n# 输出前检查\n确认结果完整回应任务，符合格式与约束；发现不确定内容时明确标出，不要编造。`;$('#output').textContent=p;let n=(goal.length>24?1:0)+(rules?1:0)+(role?1:0);$('#score').textContent=70+n*10;$('#qualitytext').textContent=n===3?'任务背景、角色和约束信息较完整。':`已包含角色、任务和输出要求。${!rules?'补充额外约束可让结果更贴合预期。':''}`;history.unshift({type,goal:goal.slice(0,30),prompt:p});history=history.slice(0,6);localStorage.promptSmithHistory=JSON.stringify(history);renderHistory()}function renderHistory(){$('#history').innerHTML=history.length?history.map((h,i)=>`<div class="navitem history" data-h="${i}">${h.goal||'未命名任务'}</div>`).join(''):'<div style="padding:8px 10px;color:var(--muted);font-size:11px">生成后会显示在这里</div>';document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{$('#output').textContent=history[+b.dataset.h].prompt})}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-type]').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type});$('#build').onclick=build;$('#new').onclick=()=>{$('#goal').value='';$('#rules').value='';$('#output').textContent='填写任务描述，然后点击“生成 Prompt”。'};$('#copy').onclick=async()=>{if(!$('#output').textContent.trim())return toast('先生成 Prompt');try{await navigator.clipboard.writeText($('#output').textContent);toast('已复制到剪贴板')}catch{toast('浏览器未开放剪贴板权限')}};$('#save').onclick=()=>{let p=$('#output').textContent;if(!p.trim())return toast('先生成 Prompt');saved.unshift({name:$('#goal').value.slice(0,28),prompt:p});localStorage.promptSmithSaved=JSON.stringify(saved);$('#savedcount').textContent=saved.length;toast('已加入收藏')};$('#savednav').onclick=()=>{if(saved.length)$('#output').textContent=saved[0].prompt;else toast('收藏列表还是空的')};$('#download').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#output').textContent],{type:'text/plain;charset=utf-8'}));a.download='promptsmith.txt';a.click()};build();$('#savedcount').textContent=saved.length;renderHistory();</script></body></html>
